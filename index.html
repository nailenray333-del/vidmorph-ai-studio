<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VidMorph AI Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 30px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #151b2e;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 18px;
    }

    label.title {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #0d1324;
      color: white;
      border-radius: 10px;
      border: 1px solid #333;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .option {
      background: #0d1324;
      padding: 12px;
      border-radius: 10px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0d1324;
      color: white;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6c5ce7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      background: #10172a;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 VidMorph AI</h1>

    <div class="subtitle">
      AI VIDEO STUDIO
    </div>

    <div class="card">
      <label class="title">Upload Your Video</label>
      <input type="file" id="videoInput" accept="video/*">
    </div>

    <div class="card">
      <label class="title">Reference Image (Optional)</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="card">
      <label class="title">Select AI Editing</label>

      <div class="options">

        <label class="option">
          <input type="checkbox" value="Clothes">
          Clothes
        </label>

        <label class="option">
          <input type="checkbox" value="Pants">
          Pants
        </label>

        <label class="option">
          <input type="checkbox" value="Shoes">
          Shoes
        </label>

        <label class="option">
          <input type="checkbox" value="Hair">
          Hair
        </label>

        <label class="option">
          <input type="checkbox" value="Body">
          Body
        </label>

        <label class="option">
          <input type="checkbox" value="Face">
          Face
        </label>

        <label class="option">
          <input type="checkbox" value="Background">
          Background
        </label>

        <label class="option">
          <input type="checkbox" value="Accessories">
          Accessories
        </label>

      </div>
    </div>

    <div class="card">
      <label class="title">Describe Your Edit</label>

      <textarea
        id="prompt"
        placeholder="Example: Change the clothes to a black leather jacket while keeping the person's face unchanged."
      ></textarea>
    </div>

    <div class="card">

      <button id="generateBtn">
        ✨ Generate AI Video
      </button>

      <div id="status"></div>

    </div>

  </div>


<script>

  // VidMorph Google Apps Script Backend
  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbwEbhvS_y_lvAufKxLG2LorJi0Rcmduorxbrrw5YN2ZQl9k_nhlwZ7vumQwAo83KIs/exec";


  const generateBtn = document.getElementById("generateBtn");
  const status = document.getElementById("status");


  generateBtn.addEventListener("click", async function () {

    const video =
      document.getElementById("videoInput").files[0];

    const image =
      document.getElementById("imageInput").files[0];

    const prompt =
      document.getElementById("prompt").value.trim();


    const selected = [];

    document
      .querySelectorAll('.options input[type="checkbox"]:checked')
      .forEach(function (checkbox) {

        selected.push(checkbox.value);

      });


    if (!video) {

      alert("Please upload a video first.");

      return;

    }


    status.style.display = "block";

    status.innerText =
      "⏳ Connecting to VidMorph AI Backend...";

    generateBtn.disabled = true;


    try {

      // Test backend connection

      const response =
        await fetch(BACKEND_URL, {
          method: "GET"
        });


      if (!response.ok) {

        throw new Error(
          "Backend connection failed."
        );

      }


      const result =
        await response.text();


      status.innerText =
        "✅ Backend connected successfully!\n\n" +

        "Selected edits: " +
        (selected.length
          ? selected.join(", ")
          : "None") +

        "\n\nPrompt: " +
        (prompt || "No prompt") +

        "\n\nBackend response:\n" +
        result +

        "\n\n⏳ AI video processing will be connected in the next step.";


    } catch (error) {

      status.innerText =
        "❌ Connection Error:\n" +
        error.message;

    }


    generateBtn.disabled = false;

  });

</script>

</body>
</html>
