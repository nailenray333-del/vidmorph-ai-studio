
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidMorph AI Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
.container{width:92%;max-width:700px;margin:24px auto}
h1{text-align:center}
.subtitle{text-align:center;color:#bbb;margin-bottom:22px}
.card{background:#151b2e;padding:18px;border-radius:14px;margin-bottom:16px}
.title{display:block;font-weight:bold;font-size:17px;margin-bottom:12px}
input[type=file]{width:100%;padding:10px;background:#0d1324;color:white;border-radius:8px}
input[type=color]{width:60px;height:42px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#6c5ce7;color:#fff;font-size:16px;font-weight:bold}
button:disabled{opacity:.55}
.preview{display:block;width:100%;max-height:420px;object-fit:contain;margin-top:12px;background-color:#ddd;border-radius:8px}
#preview{background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
#status{display:none;white-space:pre-wrap;overflow-wrap:anywhere;background:#10172a;padding:12px;border-radius:8px;margin-top:12px;line-height:1.5}
.small{font-size:13px;color:#bbb;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>🎬 VidMorph AI</h1>
<div class="subtitle">FREE AI IMAGE BACKGROUND STUDIO</div>

<div class="card">
<label class="title" for="imageInput">1. Upload Your Image</label>
<input type="file" id="imageInput" accept="image/*">
<img id="preview" class="preview" alt="Original image preview" hidden>
</div>

<div class="card">
<label class="title">2. Choose Background Color</label>
<input type="color" id="bgColor" value="#ffffff" aria-label="Background color">
<button id="removeBtn">✨ Remove Background with AI</button>
<button id="applyBtn" disabled>🎨 Apply New Background</button>
<p class="small">The first run downloads AI model files. Keep this page open and use a stable internet connection.</p>
</div>

<div class="card">
<label class="title">3. Edited Image</label>
<canvas id="canvas" class="preview" hidden></canvas>
<button id="downloadBtn" disabled>⬇️ Download PNG</button>
<div id="status" role="status" aria-live="polite"></div>
</div>
</div>

<script type="module">
const input = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const colorInput = document.getElementById("bgColor");
const removeBtn = document.getElementById("removeBtn");
const applyBtn = document.getElementById("applyBtn");
const downloadBtn = document.getElementById("downloadBtn");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let originalFile = null;
let foregroundImage = null;
let foregroundURL = null;
let sourceURL = null;
let sourceImage = null;

function message(text) {
  status.style.display = "block";
  status.textContent = text;
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Browser could not read this image."));
    img.src = url;
  });
}

function drawImage(img, background = null) {
  canvas.width = img.naturalWidth || img.width;
  canvas.height = img.naturalHeight || img.height;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (background) {
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  canvas.hidden = false;
  downloadBtn.disabled = false;
}

input.addEventListener("change", async () => {
  const file = input.files && input.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    message("Please select an image file.");
    return;
  }

  originalFile = file;
  foregroundImage = null;
  applyBtn.disabled = true;
  downloadBtn.disabled = true;
  canvas.hidden = true;

  if (sourceURL) URL.revokeObjectURL(sourceURL);
  if (foregroundURL) URL.revokeObjectURL(foregroundURL);

  sourceURL = URL.createObjectURL(file);
  preview.hidden = true;
  message("Loading image preview...");

  try {
    sourceImage = await loadImage(sourceURL);
    preview.onload = () => {
      preview.hidden = false;
    };
    preview.onerror = () => {
      message("Preview failed. Try a different JPG or PNG image.");
    };
    preview.src = sourceURL;
    preview.hidden = false;
    drawImage(sourceImage);
    message("Image loaded successfully. Tap Remove Background with AI.");
  } catch (error) {
    message("Could not load image: " + error.message);
  }
});

removeBtn.addEventListener("click", async () => {
  message("Button clicked.");

  if (!originalFile) {
    message("Please upload an image first.");
    return;
  }

  removeBtn.disabled = true;
  applyBtn.disabled = true;
  message("Loading AI library and model. First use may take several minutes...");

  try {
    const module = await import(
      "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm"
    );
    const removeBackground = module.default;

    if (typeof removeBackground !== "function") {
      throw new Error("AI library loaded but its function was not found.");
    }

    message("AI library loaded. Removing background now...");
    const resultBlob = await removeBackground(originalFile);

    if (!(resultBlob instanceof Blob) || resultBlob.size === 0) {
      throw new Error("AI returned an empty image.");
    }

    if (foregroundURL) URL.revokeObjectURL(foregroundURL);
    foregroundURL = URL.createObjectURL(resultBlob);
    foregroundImage = await loadImage(foregroundURL);
    drawImage(foregroundImage);
    applyBtn.disabled = false;
    message("Success! Background removed. Choose a color and tap Apply New Background.");
  } catch (error) {
    console.error("VidMorph background removal error:", error);
    message("Background removal failed.\n" +
      (error && error.message ? error.message : String(error)) +
      "\nCheck your internet connection. If it continues, the browser may not support the required AI files.");
  } finally {
    removeBtn.disabled = false;
  }
});

applyBtn.addEventListener("click", () => {
  if (!foregroundImage) {
    message("Remove the background first.");
    return;
  }
  drawImage(foregroundImage, colorInput.value);
  message("New background applied. Tap Download PNG to save.");
});

downloadBtn.addEventListener("click", () => {
  if (!canvas.width || !canvas.height) {
    message("Please upload an image first.");
    return;
  }

  canvas.toBlob(blob => {
    if (!blob) {
      message("PNG creation failed.");
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "vidmorph-edited.png";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    message("Download started. Check your Downloads folder.");
  }, "image/png");
});
</script>
</body>
</html>
